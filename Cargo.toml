[workspace]
members = [
    "cellhawk-ekf",
    "cellhawk-sdr",
    "cellhawk-vision",
    "cellhawk-agent",
    "cellhawk-field"
]
resolver = "2"

[workspace.dependencies]
nalgebra = "0.35.0"
tokio = { version = "1.37.0", features = ["full"] }
zeromq = "0.3.3"
ndarray = "0.15.6"
reqwest = { version = "0.11", features = ["json", "blocking"] }
redis = { version = "0.26", features = ["tokio-comp", "json"] }
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.115"
