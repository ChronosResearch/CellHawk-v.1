name: CELLHAWK Polyglot CI

on:
  push:
    branches: [ "main", "feat/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  rust-core:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - name: Cache cargo registry
      uses: actions/cache@v3
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.toml') }}
    - name: Install dependencies (ZeroMQ/pkg-config)
      run: sudo apt-get update && sudo apt-get install -y libzmq3-dev pkg-config
    - name: Build Rust Engine
      run: cargo build --release --workspace
    - name: Run Rust Tests
      run: cargo test --release --workspace

  python-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install fastapi uvicorn redis bandit
    - name: Bandit Security Scan
      run: bandit -r gcs_backend cortex_ai

  frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: "20"
    - name: Install dependencies
      run: cd frontend_dashboard && npm install
    - name: Run NPM Audit
      run: cd frontend_dashboard && npm audit || true
    - name: Build Frontend
      run: cd frontend_dashboard && npm run build --if-present
