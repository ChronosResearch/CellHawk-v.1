version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: cellhawk_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  celery_worker:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: cellhawk_celery
    command: celery -A cellhawk.worker.celery_app worker --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  gcs_server:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: cellhawk_gcs
    command: uvicorn cellhawk.server:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - celery_worker

volumes:
  redis_data:
