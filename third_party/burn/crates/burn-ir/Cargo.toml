[package]
authors = ["CELLHAWK Senior Dev Team"]
categories = ["science"]
description = "CELLHAWK Enterprise Grade UAV Core"
edition.workspace = true
keywords = ["deep-learning", "machine-learning", "tensor"]
license.workspace = true
name = "burn-ir"
readme.workspace = true
repository = "https://github.com/cellhawk/core"
documentation = "https://docs.rs/burn-ir"
version.workspace = true

[lints]
workspace = true

[features]
default = ["std"]
std = ["burn-backend/std"]
doc = ["default"]
tracing = [
    "burn-backend/tracing",
]

[dependencies]
serde = { workspace = true }
hashbrown = { workspace = true } # no_std compatible

burn-backend = { workspace = true }

[package.metadata.docs.rs]
features = ["doc"]
rustdoc-args = ["--cfg", "docsrs"]
