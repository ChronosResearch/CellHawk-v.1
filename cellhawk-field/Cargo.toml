[package]
name = "cellhawk-field"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
config = "0.15"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4", features = ["derive"] }
anyhow = "1.0"
chrono = "0.4"
reqwest = { version = "0.13", features = ["json"] }

# Local dependencies
cellhawk-ekf = { path = "../cellhawk-ekf" }
cellhawk-sdr = { path = "../cellhawk-sdr" }
cellhawk-vision = { path = "../cellhawk-vision" }
cellhawk-agent = { path = "../cellhawk-agent" }
