[workspace]
members = [
    "cellhawk-ekf",
    "cellhawk-sdr",
    "cellhawk-vision",
    "cellhawk-agent",
    "cellhawk-field"
]
resolver = "2"

[workspace.dependencies]
nalgebra = "0.32.3"
tokio = { version = "1.37.0", features = ["full"] }
zeromq = "0.3.3"
redis = { version = "0.25.3", features = ["tokio-comp", "json"] }
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.115"
