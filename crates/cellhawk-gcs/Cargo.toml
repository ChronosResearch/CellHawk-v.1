[package]
name = "cellhawk-gcs"
version = "0.1.0"
edition = "2021"

[dependencies]
cellhawk-core = { path = "../../rust_ekf_engine" }
axum = { version = "0.6", features = ["ws", "macros"] }
tokio = { version = "1.28", features = ["full"] }
redis = { version = "0.23", features = ["tokio-comp", "geospatial"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
futures = "0.3"
