[package]
name = "cellhawk-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "cellhawk_ekf"
crate-type = ["cdylib", "rlib"]

[dependencies]
nalgebra = "0.32"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
rand = "0.8"
rand_distr = "0.4"
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
base64 = "0.21"
thiserror = "2.0"
# Enterprise Cryptography and AI
tfhe = { version = "0.6", features = ["boolean", "shortint"] }
burn = { version = "0.13", features = ["train"] }
burn-ndarray = "0.13"
