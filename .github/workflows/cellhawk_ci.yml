name: "CellHawk CI Pipeline"

on:
  push:
    branches: ["main", "feat/*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: "read"
  pull-requests: "read"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: "always"
  RUST_LOG: "cellhawk=debug"
  CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
  CARGO_PROFILE_TEST_DEBUG: "line-tables-only"

jobs:
  # ============================================================
  # TIER 1: HARD GATES (Must pass to merge)
  # ============================================================
  rust-core:
    name: "Rust: Build & Test"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
      - uses: "actions/checkout@v4"
      - name: "Cache Rust dependencies"
        uses: "Swatinem/rust-cache@v2"
      - name: "Install system deps"
        run: "sudo apt-get update -qq && sudo apt-get install -y gcc g++ cmake libgmp-dev libzmq3-dev pkg-config"
      - name: "Build"
        run: "cargo build --workspace --all-targets"
      - name: "Test"
        run: "cargo test --workspace --all-targets"

  python-backend:
    name: "Python: Build"
    runs-on: "ubuntu-latest"
    timeout-minutes: 15
    steps:
      - uses: "actions/checkout@v4"
      - name: "Set up Python"
        uses: "actions/setup-python@v5"
        with:
          python-version: "3.12"
      - name: "Install dependencies"
        run: "pip install fastapi uvicorn redis"

  frontend-build:
    name: "Frontend: Build"
    runs-on: "ubuntu-latest"
    timeout-minutes: 15
    steps:
      - uses: "actions/checkout@v4"
      - name: "Set up Node.js"
        uses: "actions/setup-node@v4"
        with:
          node-version: "20"
      - name: "Install and Build"
        run: |
          cd frontend_dashboard
          npm install
          npm run build --if-present

  # ============================================================
  # TIER 2: SOFT GATES (Failsafe - Warns but allows merge)
  # ============================================================
  code-quality:
    name: "Code Quality & Security (Report Only)"
    runs-on: "ubuntu-latest"
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: "actions/checkout@v4"
      - name: "Install system deps"
        run: "sudo apt-get update -qq && sudo apt-get install -y gcc g++ cmake libgmp-dev libzmq3-dev pkg-config"
      
      - name: "Rust Clippy & Fmt"
        run: |
          cargo fmt --all -- --check || true
          cargo clippy --workspace --all-targets || true
          
      - name: "Python Security (Bandit)"
        run: |
          pip install bandit
          bandit -r gcs_backend cortex_ai || true

      - name: "Frontend Audit"
        run: |
          cd frontend_dashboard
          npm install
          npm audit || true

  # ============================================================
  # FINAL GATE
  # ============================================================
  ci-gate:
    name: "All required checks passed"
    needs: ["rust-core", "python-backend", "frontend-build"]
    runs-on: "ubuntu-latest"
    if: "always()"
    steps:
      - name: "Check results"
        run: |
          if [ "${{ needs.rust-core.result }}" != "success" ] || \
             [ "${{ needs.python-backend.result }}" != "success" ] || \
             [ "${{ needs.frontend-build.result }}" != "success" ]; then
            echo "Required checks failed"
            exit 1
          fi
          echo "All checks passed"
