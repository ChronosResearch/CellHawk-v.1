<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CELLHAWK GCS Dashboard</title>
    <link href="https://unpkg.com/maplibre-gl@3.0.0/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
      body, html { margin: 0; padding: 0; height: 100%; font-family: 'Inter', sans-serif; background: #0f172a; color: #f8fafc; }
      #map { width: 100%; height: 100vh; }
      #hud {
        position: absolute;
        top: 20px;
        left: 20px;
        background: rgba(15, 23, 42, 0.8);
        padding: 20px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        z-index: 10;
        min-width: 250px;
      }
      h1 { margin: 0 0 10px 0; font-size: 1.2rem; color: #38bdf8; text-transform: uppercase; letter-spacing: 1px; }
      .metric { margin-bottom: 8px; font-size: 0.9rem; }
      .value { font-weight: bold; color: #10b981; }
      .warning { color: #f59e0b; }
      .critical { color: #ef4444; }
    </style>
  </head>
  <body>
    <div id="hud">
      <h1>CELLHAWK GCS</h1>
      <div class="metric">Status: <span id="status" class="value">CONNECTING...</span></div>
      <div class="metric">Tier: <span id="tier" class="value">--</span></div>
      <div class="metric">Pos X: <span id="pos-x" class="value">--</span> m</div>
      <div class="metric">Pos Y: <span id="pos-y" class="value">--</span> m</div>
      <div class="metric">RMS Error: <span id="rms" class="value">--</span> m</div>
    </div>
    <div id="map"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
