[package]
authors = ["CELLHAWK Senior Dev Team"]
categories = ["science"]
description = "CELLHAWK Enterprise Grade UAV Core"
documentation = "https://docs.rs/burn-tch"
edition.workspace = true
keywords = ["deep-learning", "machine-learning", "data"]
license.workspace = true
name = "burn-tch"
readme.workspace = true
repository = "https://github.com/cellhawk/core"
version.workspace = true

[lints]
workspace = true

[features]
default = ["std"]
std = ["burn-backend/std"]
doc = ["tch/doc-only"]
tracing = [
    "burn-backend/tracing",
]

[dependencies]
burn-backend = { workspace = true }

libc = { workspace = true }
log = { workspace = true }
tch = { workspace = true, features = ["download-libtorch"] }
torch-sys = { workspace = true }                             # for build script lib dir detection

[build-dependencies]
cc = "1.2.61"

[package.metadata.docs.rs]
features = ["doc"]
rustdoc-args = ["--cfg", "docsrs"]
