name: CellHawk CI Pipeline

on:
  push:
    branches: ["main", "feat/*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  RUST_LOG: "cellhawk=debug"
  CACHE_VERSION: "v3"

jobs:

  # ==============================================================================
  # TIER 1 -- HARD GATES (failures block the PR merge)
  # ==============================================================================

  rust-build:
    name: "Rust: Build (debug)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Rust toolchain + registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ env.CACHE_VERSION }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ env.CACHE_VERSION }}-cargo-

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc g++ cmake libgmp-dev libzmq3-dev pkg-config

      - name: cargo build (debug, all targets)
        run: cargo build --workspace --all-targets

  rust-test:
    name: "Rust: Tests"
    runs-on: ubuntu-latest
    needs: [rust-build]
    steps:
      - uses: actions/checkout@v4

      - name: Cache Rust toolchain + registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ env.CACHE_VERSION }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ env.CACHE_VERSION }}-cargo-

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc g++ cmake libgmp-dev libzmq3-dev pkg-config

      - name: cargo test workspace
        run: cargo test --workspace --all-targets

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@cargo-tarpaulin

      - name: Coverage report
        run: cargo tarpaulin --engine llvm --workspace --timeout 120 --out xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  python-backend:
    name: "Python: Build and Test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn redis pytest

  frontend-build:
    name: "Frontend: Build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install dependencies
        run: cd frontend_dashboard && npm ci || npm install

      - name: Build Frontend
        run: cd frontend_dashboard && npm run build --if-present

  # ==============================================================================
  # TIER 2 -- SOFT GATES (failures annotate the PR but do NOT block merge)
  # These run in parallel and use continue-on-error: true.
  # ==============================================================================

  rust-clippy:
    name: "Rust: Clippy and Fmt (report only)"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc g++ cmake libgmp-dev libzmq3-dev pkg-config

      - name: cargo clippy (warnings as annotations)
        run: cargo clippy --workspace --all-targets || true

      - name: cargo fmt check
        run: cargo fmt --all -- --check || true

  rust-security:
    name: "Rust: Security Scan (report only)"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: cargo deny check
        run: cargo deny check || true

  rust-docs:
    name: "Rust: Documentation (report only)"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc g++ cmake libgmp-dev libzmq3-dev pkg-config

      - name: cargo doc
        run: cargo doc --no-deps --workspace || true

  rust-deps:
    name: "Rust: Dependency Audit (report only)"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Check for duplicate crates
        run: cargo tree --duplicates || true

  python-security:
    name: "Python: Security Scan (report only)"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install bandit
      - name: Bandit Security Scan
        run: bandit -r gcs_backend cortex_ai || true

  frontend-audit:
    name: "Frontend: Audit (report only)"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"
      - name: Install dependencies
        run: cd frontend_dashboard && npm ci || npm install
      - name: Run NPM Audit
        run: cd frontend_dashboard && npm audit || true

  # ==============================================================================
  # FINAL GATE -- only depends on the HARD gates
  # ==============================================================================

  ci-gate:
    name: "All required checks passed"
    needs: [rust-build, rust-test, python-backend, frontend-build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check hard gate results
        run: |
          echo "rust-build:     ${{ needs.rust-build.result }}"
          echo "rust-test:      ${{ needs.rust-test.result }}"
          echo "python-backend: ${{ needs.python-backend.result }}"
          echo "frontend-build: ${{ needs.frontend-build.result }}"
          if [ "${{ needs.rust-build.result }}" != "success" ] || \
             [ "${{ needs.rust-test.result }}" != "success" ] || \
             [ "${{ needs.python-backend.result }}" != "success" ] || \
             [ "${{ needs.frontend-build.result }}" != "success" ]; then
            echo "One or more required checks failed"
            exit 1
          fi
          echo "All required checks passed"
